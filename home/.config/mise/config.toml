# Global mise config — deployed to ~/.config/mise/config.toml.
#
# Tools that must work in ANY directory belong here, not in the dotfiles repo's
# own mise.toml. A `[tools]` entry in a project config only resolves inside that
# project: outside it, the shim exists but errors with
# "No version is set for shim: <name>".
#
# Versions here are PINNED EXACTLY on purpose: Renovate's mise manager opens a
# PR when a pinned tool has a newer release, so the pin is the subscription.
# A `"latest"` entry gives Renovate nothing to bump. See renovate.json.

[settings]
# Record exact resolved URLs + checksums in mise.lock so a fresh machine
# installs byte-identical tools rather than whatever "latest" means that day.
lockfile = true

  [settings.github]
  # Borrow the `gh` CLI's token. Resolving github/aqua-backed tools hits the
  # GitHub API, and unauthenticated requests get 60/hour — enough to fail an
  # install of a dozen tools with "API rate limit exceeded".
  gh_cli_tokens = true

[tools]
go = "latest"
node = "24"
ruby = "3"
"npm:typescript" = "latest"

# ── Third-party CLIs ────────────────────────────────────────────────────────
# Pinned exactly rather than floating: a `latest`/`@latest` spec can resolve to
# a prerelease or a local pseudo-version and silently stop tracking releases.

# Plannotator — browser-based plan/diff review. Pinned release asset rather than
# `curl | bash` from plannotator.ai: the vendor installer also writes agent
# skills, Codex hooks, and pulls third-party skills via `npx skills`. The CLI is
# the only part we want; the review skills in home/.ai/skills are hand-written.
"github:backnotprop/plannotator" = { version = "0.27.15", matching = "plannotator-" }
"github:colonyops/hive" = "0.59.0"
# Task-runner proxy (Makefile/Taskfile/mise) that the adopted hive workflow
# skills and the orchestrator workspace call as `mi`.
"github:hay-kot/mi" = "0.4.0"
# Watches ~/Downloads and converts HEIC to JPEG; runs as a LaunchAgent via
# `mise run dirwatch-service`. Config: home/.config/dirwatch/dirwatch.yml.
"github:hay-kot/dirwatch" = "0.1.1"
"github:googleworkspace/cli" = "0.22.5"
# `latest` resolves to prereleases here (0.27.0.beta5), so pin the stable line.
"gem:ruby-lsp" = "0.26.11"
# Heroku CLI via npm rather than brew: core's `brew:heroku` depends on brew's
# `node`, which would install a second Node alongside the one mise already
# manages (and collides with orphaned npm/npx in /opt/homebrew/bin). Same
# version either way.
"npm:heroku" = "11.10.0"

# ── Secrets and linting ──────────────────────────────────────────────────────
# sops/age back the secrets tasks (SOPS_AGE_KEY_FILE in .zshrc); shellcheck
# lints the shell scripts here. The Kubernetes/Jsonnet toolchain is work-only
# and lives in mise.grafana.toml.
"sops" = "3.12.2"
"age" = "1.3.1"
"shellcheck" = "0.11.0"
