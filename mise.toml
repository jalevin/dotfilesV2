# No [tools] here on purpose. This repo needs no project-specific tools, and a
# `[tools]` entry in a project config only resolves inside that project —
# outside it the shim errors with "No version is set for shim: <name>".
# Globally-available CLIs live in home/.config/mise/config.toml instead.

# ---------------------------------------------------------
# Dotfiles — opt-in: only what's listed deploys.
#
# Granularity is deliberate. A whole-directory link is only safe when nothing
# else lives at that path; anywhere the tool writes its own state next to our
# config, the entry must be `symlink-each` so a link is made per file instead of
# shadowing the directory.
#
# Verify with `mise bootstrap dotfiles diff` / `status` before applying.

[dotfiles]
# Cross-harness agent instructions. The same file reaches Claude Code as
# ~/.claude/CLAUDE.md (via the home/.claude/CLAUDE.md symlink) and everything
# that follows the AGENTS.md convention (Codex, Cursor, Amp) as ~/AGENTS.md.
"~/AGENTS.md" = "home/.ai/AGENTS.md"

"~/.zshrc" = "home/.zshrc"
"~/.gemrc" = "home/.gemrc"
"~/.sqliterc" = "home/.sqliterc"

# Whole-directory links — we own these paths outright.
"~/.ai" = "home/.ai"
"~/.config/agent-deck" = "home/.config/agent-deck"
"~/.config/ghostty" = "home/.config/ghostty"
"~/.config/k9s" = "home/.config/k9s"
"~/.config/nvim" = "home/.config/nvim"
"~/.config/ripgrep" = "home/.config/ripgrep"
"~/.config/tmux" = "home/.config/tmux"

# Per-file links — each of these directories holds live state we must not
# shadow: Claude Code's sessions/cache/history, git's local `gitk`, gh's auth in
# hosts.yml, mise's own miserc.toml, and ~/.local/bin's other binaries.
"~/.claude" = { source = "home/.claude", mode = "symlink-each" }
"~/.config/gh" = { source = "home/.config/gh", mode = "symlink-each" }
"~/.config/git" = { source = "home/.config/git", mode = "symlink-each" }
"~/.config/glow" = { source = "home/.config/glow", mode = "symlink-each" }
"~/.config/lazygit" = { source = "home/.config/lazygit", mode = "symlink-each" }
# ~/.config/mise is linked as a WHOLE DIRECTORY, unlike its neighbours above.
# mise writes files here itself — mise.lock (`mise lock --global`), miserc.toml
# (`mise run stamp`), and per-tool npm metadata under locks/. A per-file
# symlink can be destroyed by a temp-file-plus-rename save, because rename()
# replaces the directory entry rather than following it, and nothing errors when
# that happens: the repo copy just silently stops updating. Linking the
# directory keeps every such write inside the repo, and .gitignore decides what
# actually gets committed (mise.lock yes; miserc.toml and locks/ no).
"~/.config/mise" = "home/.config/mise"

# No hive entries on purpose — its configs live in iCloud, not this repo. See
# [tasks.hive-link].

# ~/.local/bin holds plenty we don't manage, so each binary is listed
# explicitly rather than linking the directory. The telegram commands link
# straight out of `telegram/` — the scripts, docs, and bot assets stay there as
# one package, and only the five commands reach PATH.
"~/.local/bin/find-env" = "home/.local/bin/find-env"
"~/.local/bin/tg-await" = "telegram/tg-await"
"~/.local/bin/tg-brokerd" = "telegram/tg-brokerd"
"~/.local/bin/tg-listen" = "telegram/tg-listen"
"~/.local/bin/tg-notify" = "telegram/tg-notify"
"~/.local/bin/tg-setup" = "telegram/tg-setup"

# ---------------------------------------------------------
# System packages
#
# This is the shared set. Overlay [bootstrap.packages] merges with it the same
# way [dotfiles] does, so a machine-specific package goes in mise.<env>.toml:
# gcloud-cli is grafana-only, discord/signal are personal-only.
#
# WARNING: `mise bootstrap packages prune` is NOT dependency-aware for formulae
# Homebrew marks "installed on request". Such a formula looks undeclared even
# when declared packages depend on it, so prune offers to remove it out from
# underneath them. On this machine it proposed 103 removals including cairo —
# a dependency of ffmpeg, harfbuzz, libass, openslide, pango, poppler and
# tesseract, all of which would break. Use `mise run packages-prune` (dry-run)
# and treat the output as a review list to pick from by hand.

# Adopt apps already present at the cask's destination instead of reinstalling
# them. mise verifies the current artifact and adopts in place when the content
# matches; a cask declaring auto_updates: true adopts as-is (it may have updated
# itself already). Without this, mise defers to Homebrew for anything brew
# installed and reports "managed by Homebrew; leaving unchanged".
[bootstrap.brew]
adopt = true

[bootstrap.packages]
# Core CLI
"brew:git" = "latest"
"brew:git-lfs" = "latest"
"brew:gh" = "latest"
"brew:glow" = "latest"
"brew:curl" = "latest"
"brew:wget" = "latest"
"brew:coreutils" = "latest"
"brew:bat" = "latest"
"brew:fd" = "latest"
"brew:fswatch" = "latest"
"brew:ripgrep" = "latest"
"brew:jq" = "latest"
"brew:tree" = "latest"
"brew:tldr" = "latest"
"brew:entr" = "latest"
"brew:gnupg" = "latest"
# Tmux
"brew:tmux" = "latest"
"brew:bash" = "latest"
"brew:bc" = "latest"
"brew:fzf" = "latest"
"brew:lazygit" = "latest"
# Neovim
"brew:neovim" = "latest"
"brew:luarocks" = "latest"
# Languages & Runtimes
"brew:yarn" = "latest"
# Dev Tools
"brew:git-gui" = "latest"
"brew:htop" = "latest"
"brew:ctop" = "latest"
"brew:dive" = "latest"
"brew:gcx" = "latest"                  # Grafana Cloud CLI (in homebrew-core)
"brew:mole" = "latest"
"brew:mosh" = "latest"
"brew:nmap" = "latest"
"brew:speedtest-cli" = "latest"
"brew:weave" = "latest"  # semantic merge driver for git
# Infrastructure
"brew:ansible" = "latest"
"brew:azure-cli" = "latest"
"brew:awscli" = "latest"
# Build Tools
"brew:go-task" = "latest"
# Media
"brew:ffmpeg" = "latest"
"brew:imagemagick" = "latest"
# Renamed upstream: `whisper-cpp` is now an alias for `whisper.cpp`, and the
# stale name makes mise report "needs repair".
"brew:whisper.cpp" = "latest"
"brew:yt-dlp" = "latest"

# Casks — `packages import` does not handle these, so they are hand-written.
# Personal-machine apps (discord, signal) live in mise.personal.toml.
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:brave-browser" = "latest"
# The desktop app (/Applications/Claude.app). Claude Code is a different
# product with the same name — it self-updates into ~/.local/share/claude and
# is deliberately NOT declared here; see `mise run claude-prune`.
"brew-cask:claude" = "latest"
"brew-cask:cleanshot" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:dbeaver-community" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:handy" = "latest"
"brew-cask:meetingbar" = "latest"
# adopt=false: the installed 1.11.x bundle has no obsidian-cli, which the
# current cask declares as a binary artifact, so adoption fails. Take the real
# install instead — it replaces the bundle but leaves the vault and settings.
"brew-cask:obsidian" = { adopt = false }
"brew-cask:orbstack" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:tuple" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:whatsapp" = "latest"

# ---------------------------------------------------------
# macOS system defaults
#
# Declarative half: `mise bootstrap macos defaults status` reports drift per key
# and `apply` converges it. The imperative remainder — anything needing sudo, a
# `-dict-add` composite value, or PlistBuddy — stays in `install/macos`, run via
# `mise run macos-imperative`.
#
# Values are NOT templated: `{{env.HOME}}` is stored literally, so the one path
# value below is absolute.

[bootstrap.directories]
"/Users/jeff/Downloads/Screenshots" = { mode = "0755" }

[bootstrap.macos.defaults."com.apple.screencapture"]
location = "/Users/jeff/Downloads/Screenshots"
style = "selection"

[bootstrap.macos.defaults."com.apple.dock"]
orientation = "left"
tilesize = 36
autohide = true
magnification = false
appswitcher-all-displays = true

[bootstrap.macos.defaults."com.apple.finder"]
ShowPathbar = true
_FXShowPosixPathInTitle = true
# search the current folder by default
FXDefaultSearchScope = "SCcf"
# list view everywhere; other modes are `icnv`, `clmv`, `glyv`
FXPreferredViewStyle = "Nlsv"
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
# no .DS_Store on network or USB volumes
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
NSWindowResizeTime = 0.001
AppleInterfaceStyleSwitchesAutomatically = true
# no swipe to navigate back/forward in browsers
AppleEnableSwipeNavigateWithScrolls = false
# AppleMiniaturizeOnDoubleClick is legacy and ignored; this is the current key
AppleActionOnDoubleClick = "None"
NSAutomaticDashSubstitutionEnabled = false
"com.apple.mouse.scaling" = 2.0
"com.apple.trackpad.forceClick" = true
# blazingly fast key repeat
InitialKeyRepeat = 10
KeyRepeat = 1

# Ice is pinned to a prerelease by `install/scripts/ice.sh` — the cask tracks
# jordanbaird/ice-releases, whose newest release is 0.11.12 (Oct 2024), older
# than the Tahoe-compatible dev build. Sparkle self-updating would move Ice off
# that pin. Declared here rather than in the script because the script exits
# early once Ice is current, so writes there would not converge.
[bootstrap.macos.defaults."com.jordanbaird.Ice"]
SUEnableAutomaticChecks = false
SUAutomaticallyUpdate = false

[bootstrap.hooks]
# Close System Settings first so it can't overwrite what we're about to write.
pre-defaults = "osascript -e 'tell application \"System Settings\" to quit' || true"
# `launchctl kickstart -k` kills-if-running and (re)starts atomically, so it works
# even when the process is already down — unlike `killall`, which does nothing to a
# dead Dock and can leave it down if a kill races launchd's relaunch.
post-defaults = """
launchctl kickstart -k "gui/$(id -u)/com.apple.Dock.agent" 2>/dev/null || killall Dock 2>/dev/null || true
launchctl kickstart -k "gui/$(id -u)/com.apple.SystemUIServer.agent" 2>/dev/null || killall SystemUIServer 2>/dev/null || true
"""

[tasks.packages]
description = "Install declared [bootstrap.packages] (taps, formulae, casks)"
run = "mise bootstrap --yes --only packages"

[tasks.packages-prune]
# Dry-run only: the output needs human triage — see the prune warning on
# [bootstrap.packages] above.
# Both overlays are loaded as a guard rather than a present need — no packages
# live in an overlay today, but `prune` only ever sees the ACTIVE config, so a
# single-env run would target anything that later did.
description = "Report brew packages installed but no longer declared (dry-run)"
run = """
MISE_ENV=grafana,personal mise bootstrap packages prune --dry-run
echo
echo "Dry-run only. To act on the list above:"
echo "  MISE_ENV=grafana,personal mise bootstrap packages prune   # remove them"
echo "  mise bootstrap packages import --dry-run                  # or declare them"
"""

[tasks.dotfiles]
description = "Deploy config symlinks from [dotfiles] (replaces GNU Stow)"
run = "mise bootstrap --yes --only dotfiles"

[tasks.secrets-pull]
description = "Fetch secrets from 1Password (with preview)"
run = "./tasks/secrets-pull.sh"

[tasks.secrets-push]
description = "Upload local secrets to 1Password (with preview)"
run = "./tasks/secrets-push.sh"

[tasks.secrets-check]
description = "Check if local secrets match 1Password"
run = "./tasks/secrets-check.sh"

[tasks.backup-projects]
description = "Create tar archive of ~/projects (excludes large dirs and dotfiles)"
run = "./tasks/backup-projects.sh"

[tasks.fonts]
description = "Install fonts to ~/Library/Fonts"
run = "find fonts -name '*.ttf' -exec cp {} ~/Library/Fonts/ \\;"

[tasks.neovim-setup]
# `restore`, not `sync`: sync also updates every plugin and rewrites
# lazy-lock.json on each converge. Bump plugins deliberately with `:Lazy update`.
description = "Install Neovim plugins at the commits pinned in lazy-lock.json"
depends = ["dotfiles"]
run = "nvim --headless \"+Lazy! restore\" +qa"

[tasks.neovim-reset]
description = "Remove Neovim lazy.nvim data"
run = "rm -rf ~/.local/share/nvim/lazy ~/.local/share/nvim/lazy-rocks"

[tasks.tmux-setup]
description = "Install TPM and tmux plugins"
depends = ["dotfiles"]
run = "./tasks/tmux-setup.sh"

[tasks.stamp]
description = "Pin this machine's MISE_ENV in ~/.config/mise/miserc.toml (run once)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -z "${MISE_ENV:-}" ]; then
  echo "stamp: MISE_ENV is not set. Run as one of:" >&2
  echo "  MISE_ENV=grafana  mise run stamp   # work laptop" >&2
  echo "  MISE_ENV=personal mise run stamp   # personal laptop" >&2
  exit 1
fi

for env in ${MISE_ENV//,/ }; do
  if [ ! -f "mise.${env}.toml" ]; then
    echo "stamp: no mise.${env}.toml in this repo; refusing to pin a nonexistent overlay" >&2
    exit 1
  fi
done

mkdir -p ~/.config/mise
printf 'env = [%s]\n' "$(printf '%s' "$MISE_ENV" | tr -d '[:space:]' | sed 's/[^,]*/"&"/g')" \
  > ~/.config/mise/miserc.toml
echo "stamp: pinned MISE_ENV=$MISE_ENV -> $(cat ~/.config/mise/miserc.toml)"
echo "stamp: this file is machine-local and intentionally not committed."
'''

[tasks.check]
description = "Read-only: report drift between this config and the machine"
run = """
mise bootstrap status
echo
mise bootstrap plan
echo
CHECK=1 mise run codex-skills
"""

[tasks.macos-defaults]
description = "Converge declarative macOS defaults + directories (drift-checked)"
run = "mise bootstrap --yes --only files,macos-defaults"

[tasks.macos-imperative]
description = "Apply the macOS settings bootstrap can't express (sudo, dict-add, PlistBuddy)"
run = "./install/macos"

[tasks.osx-settings]
description = "Apply all macOS settings (declarative pass, then the imperative remainder)"
depends = ["macos-defaults", "macos-imperative"]

[tasks.go-link]
description = "Symlink ~/go -> ~/projects/go (GOPATH) so default ~/go/pkg/mod resolves"
run = """
if [ -e "$HOME/go" ] && [ ! -L "$HOME/go" ]; then
  echo "go-link: ~/go exists and is not a symlink; leaving it alone" >&2
  echo "  if it only holds a module cache: chmod -R u+w ~/go && rm -rf ~/go, then: mise run go-link" >&2
  exit 1
fi
ln -sfn "$HOME/projects/go" "$HOME/go"
echo "linked ~/go -> ~/projects/go"
"""

[tasks.hive-link]
# hive's configs are NOT in this repo. They can carry private roadmap detail and
# this repo is public, so they live in iCloud under hive/<env>/ and reach the
# machine as one whole-directory symlink.
#
# Whole-directory, not per-file: Hive Desktop saves by temp-file-plus-rename,
# which replaces a per-file symlink with a real file — rename() swaps the
# directory entry rather than following it — and nothing errors, so the link
# just silently detaches. A link at the directory level is written *through*.
#
# Both the CLI and the app read ~/.config/hive by default, so no HIVE_CONFIG or
# HIVE_DESKTOP_CONFIG_DIR plumbing is needed. That matters for the app: it is
# launched from the Dock and would never see a .zshrc export.
#
# Every failure path exits 0 on purpose: this runs inside [tasks.bootstrap], and
# a hard failure would abort the whole converge — fonts, neovim, macOS defaults —
# because iCloud had not finished syncing. It reports loudly and moves on; run
# `mise run hive-link` again once the folder is there.
description = "Point ~/.config/hive at this machine's iCloud hive config"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ICLOUD="$HOME/Library/Mobile Documents/com~apple~CloudDocs/hive"
LINK="$HOME/.config/hive"

if [ -z "${MISE_ENV:-}" ]; then
  echo "hive-link: MISE_ENV is not set; run \`mise run stamp\` first" >&2
  exit 0
fi

# MISE_ENV may be a comma-separated list; take the first that has a folder
target=""
for e in ${MISE_ENV//,/ }; do
  if [ -d "$ICLOUD/$e" ]; then target="$ICLOUD/$e"; break; fi
done

if [ -z "$target" ]; then
  echo "hive-link: no iCloud config for MISE_ENV=$MISE_ENV under $ICLOUD" >&2
  echo "  expected one of: $(printf '%s ' ${MISE_ENV//,/ })" >&2
  echo "  create it (or wait for iCloud to sync), then: mise run hive-link" >&2
  exit 0
fi

if [ -L "$LINK" ]; then
  current="$(readlink "$LINK")"
  [ "$current" = "$target" ] && { echo "hive-link: already -> $target"; exit 0; }
  ln -sfn "$target" "$LINK"
  echo "hive-link: repointed $LINK -> $target (was $current)"
  exit 0
fi

# A real directory here holds live config we must not clobber.
if [ -e "$LINK" ]; then
  echo "hive-link: $LINK exists and is not a symlink; refusing to replace it" >&2
  echo "  move it aside, then re-run:  mv \"$LINK\" \"$LINK.bak\"" >&2
  exit 0
fi

mkdir -p "$(dirname "$LINK")"
ln -s "$target" "$LINK"
echo "hive-link: linked $LINK -> $target"
'''

[tasks.codex-skills]
# Codex reads skills from ~/.codex/skills; the in-repo home/.claude/skills
# symlink only serves Claude Code. Derived from `git ls-files` rather than a
# list here, because .gitignore's allowlist is already the opt-in gate for a
# skill — a second registration would just be another place to forget, and
# forgetting it fails silently. It also excludes home/.ai/skills/synced/ for
# free: that is the untracked org/account sync, which is Claude's to manage.
#
# Links whole skill directories, not files. ~/.codex/skills must stay a real
# directory: it holds live state (.system) and hand-made links into other repos
# (paperclip), both of which this leaves alone.
#
# `CHECK=1` reports drift and changes nothing, which is how `mise run check`
# covers these links — they are not `[dotfiles]` entries, so
# `mise bootstrap dotfiles status` cannot see them.
description = "Link repo-tracked skills into ~/.codex/skills (CHECK=1 to report only)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

CHECK="${CHECK:-}"
SRC="$(git rev-parse --show-toplevel)/home/.ai/skills"
DEST="$HOME/.codex/skills"
[ -n "$CHECK" ] || mkdir -p "$DEST"
[ -d "$DEST" ] || { echo "codex-skills: $DEST does not exist yet"; exit 0; }

want="$(git ls-files 'home/.ai/skills/*/SKILL.md' | cut -d/ -f4 | sort -u)"
[ -n "$want" ] || { echo "codex-skills: no tracked skills found; refusing to prune" >&2; exit 0; }

linked=0
for name in $want; do
  target="$SRC/$name"
  link="$DEST/$name"
  [ -d "$target" ] || { echo "codex-skills: tracked but missing on disk: $name" >&2; continue; }
  if [ -L "$link" ] && [ "$(readlink "$link")" = "$target" ]; then continue; fi
  if [ -e "$link" ] && [ ! -L "$link" ]; then
    echo "codex-skills: $link exists and is not a symlink; leaving it" >&2; continue
  fi
  if [ -n "$CHECK" ]; then echo "  would link  $name"; else ln -sfn "$target" "$link"; echo "  linked $name"; fi
  linked=$((linked + 1))
done

# Prune only links we own: ones pointing into SRC whose skill is no longer
# tracked. Anything pointing elsewhere (paperclip) or not a symlink is left.
pruned=0
for link in "$DEST"/*; do
  [ -L "$link" ] || continue
  tgt="$(readlink "$link")"
  case "$tgt" in "$SRC"/*) ;; *) continue ;; esac
  name="$(basename "$link")"
  printf '%s\n' $want | grep -qx "$name" && continue
  if [ -n "$CHECK" ]; then echo "  would prune $name (no longer tracked)"; else rm "$link"; echo "  pruned $name"; fi
  pruned=$((pruned + 1))
done

n=$(printf '%s\n' $want | wc -l | tr -d ' ')
if [ -z "$CHECK" ]; then
  echo "codex-skills: $n tracked, $linked linked, $pruned pruned"
elif [ $((linked + pruned)) -eq 0 ]; then
  echo "codex-skills: $n tracked, in sync"
else
  echo "codex-skills: $n tracked, DRIFT — $linked to link, $pruned to prune" >&2
fi
'''

[tasks.icloud-check]
# Fails hard: hive's config and the Obsidian vault live in iCloud, so a machine
# without it converges into a half-working state. Apple exposes no supported
# way to enable it from a script, so this can only stop and say how.
description = "Require iCloud Desktop & Documents sync (fails if off)"
run = '''
#!/usr/bin/env bash
desktop="$(defaults read com.apple.finder FXICloudDriveDesktop 2>/dev/null || echo 0)"
documents="$(defaults read com.apple.finder FXICloudDriveDocuments 2>/dev/null || echo 0)"

if [ "$desktop" = 1 ] && [ "$documents" = 1 ]; then
  echo "icloud-check: Desktop & Documents sync is on"
  exit 0
fi

echo "icloud-check: iCloud Desktop & Documents sync is OFF; set it up before converging" >&2
echo "  System Settings > Apple ID > iCloud > iCloud Drive > Options" >&2
echo "  -> enable 'Desktop & Documents Folders', wait for it to sync, then re-run" >&2
exit 1
'''

[tasks.install-scripts]
description = "Run install scripts for tools not managed by Homebrew"
run = "./tasks/install-scripts.sh"

[tasks.bump]
description = "Update Claude Code and Hive to latest (plannotator is pinned in [tools])"
run = """
./install/scripts/claude-code.sh
./install/scripts/hive.sh
"""

[tasks.update]
# Named `update` because `up` and `upgrade` are both mise builtins (`up` is an
# alias for `mise upgrade`) and a task cannot shadow a builtin.
#
# One command for both kinds of package, because mise splits them:
# `mise bootstrap packages upgrade` handles brew formulae and casks, while
# `mise upgrade` handles [tools]. This dispatches on where the name is declared.
#   mise update            -> everything
#   mise update codex      -> just that cask
#   mise update crossplane -> just that tool
description = "Upgrade one package or tool by name (no args = everything)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ "$#" -eq 0 ]; then
  mise bootstrap packages upgrade --yes
  mise upgrade
  exit 0
fi

pkgs="$(mise bootstrap packages status 2>/dev/null || true)"
tools="$(mise ls 2>/dev/null || true)"

for name in "$@"; do
  # Declared brew formula or cask? `packages status` is "<manager> <name> ...".
  manager=""
  while read -r mgr nm _rest; do
    if [ "$nm" = "$name" ]; then manager="$mgr"; break; fi
  done <<< "$pkgs"

  if [ -n "$manager" ]; then
    echo "==> $manager:$name"
    mise bootstrap packages upgrade --yes "$manager:$name"
    continue
  fi

  # A [tools] entry? Accept the full spec or its trailing component, so `hive`
  # finds github:colonyops/hive. ${cand##*[/:]} strips any backend prefix.
  spec=""
  while read -r cand _rest; do
    if [ -z "$cand" ]; then continue; fi
    if [ "$cand" = "$name" ] || [ "${cand##*[/:]}" = "$name" ]; then
      spec="$cand"; break
    fi
  done <<< "$tools"

  if [ -n "$spec" ]; then
    echo "==> $spec"
    mise upgrade "$spec"
    continue
  fi

  echo "update: '$name' is not a declared package or tool" >&2
  echo "    packages: mise bootstrap packages status" >&2
  echo "    tools:    mise ls" >&2
  exit 1
done
'''

[tasks.claude-prune]
# Claude Code self-updates and keeps every version it has ever installed —
# ~205MB each, 1.2GB after six releases. Nothing prunes them automatically.
# Keeps the running version plus one rollback; override with KEEP=1 to keep
# only the current one.
description = "Remove old Claude Code versions (keeps current + one rollback)"
run = """
#!/usr/bin/env bash
set -euo pipefail

VDIR="$HOME/.local/share/claude/versions"
LINK="$HOME/.local/bin/claude"
KEEP="${KEEP:-2}"

[ -d "$VDIR" ] || { echo "claude-prune: no versions directory, nothing to do"; exit 0; }

# Resolve the active version from the launcher rather than assuming the highest
# number is live — a rollback would make that wrong.
current="$(basename "$(readlink "$LINK" 2>/dev/null || true)")"
if [ -z "$current" ] || [ ! -d "$VDIR/$current" ]; then
  echo "claude-prune: cannot resolve the active version from $LINK; refusing to guess" >&2
  exit 1
fi

keep="$(printf '%s\n%s\n' "$current" "$(ls -1 "$VDIR" | sort -V | tail -n "$KEEP")" | sort -u)"

removed=0
for v in $(ls -1 "$VDIR" | sort -V); do
  printf '%s\n' "$keep" | grep -qx "$v" && continue
  rm -rf "$VDIR/$v"
  echo "  removed $v"
  removed=$((removed + 1))
done

echo "claude-prune: removed $removed; kept $(printf '%s' "$keep" | tr '\n' ' ')($(du -sh "$VDIR" | cut -f1) remaining)"
"""

[tasks.upgrade]
# `packages upgrade` refreshes Homebrew's own metadata, so no separate
# `brew update` is needed.
# Covers formulae and casks, which are mise-owned. Self-updating apps
# that are running are skipped ("installed app is running and updates itself"),
# so this will not replace a live browser out from under you.
# For one package: `mise bootstrap packages upgrade brew-cask:codex`
description = "Upgrade declared packages and pinned [tools]"
run = ["mise bootstrap packages upgrade --yes", "mise upgrade"]

[tasks.upgrade-mise]
description = "Upgrade mise (installed via mise.run, not brew)"
run = "mise self-update"

[tasks.bootstrap]
# `mise bootstrap` runs a task named `bootstrap` as its final step, after
# packages, dotfiles, macOS defaults and tools are all in place. This is the
# imperative remainder — everything that cannot be declared.
# Must stay idempotent: mise re-runs it on every converge.
description = "Imperative setup remainder (mise bootstrap's final step)"
depends = ["fonts", "go-link", "icloud-check", "hive-link", "codex-skills", "neovim-setup", "tmux-setup", "install-scripts", "macos-imperative"]

[tasks.apply]
# Kept as the documented entry point; `mise bootstrap` does the real work and
# calls the `bootstrap` task above at the end.
description = "Converge this machine (declarative bootstrap + imperative remainder)"
run = "mise bootstrap --yes"

[tasks.sync]
# Pull first so a machine converges against the latest committed config — useful
# with two laptops. --ff-only so an unattended run never invents a merge commit,
# and a failed pull is non-fatal: no network or a diverged branch must not stop
# the machine from converging against what is already checked out.
description = "Pull latest config, then converge this machine"
run = """
git pull --autostash --ff-only || echo "sync: pull failed — converging against the checked-out config" >&2
mise bootstrap --yes
"""
