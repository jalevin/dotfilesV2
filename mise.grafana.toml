# Grafana work machine overlay.
#
# Active when MISE_ENV includes `grafana` — pinned per machine in
# ~/.config/mise/miserc.toml by `MISE_ENV=grafana mise run stamp`. That file is
# deliberately machine-local and never committed; it works because
# ~/.config/mise is deployed with `symlink-each`, so only config.toml is linked
# and a real miserc.toml can sit beside it.
#
# Overlay [dotfiles] entries merge with the base and override a matching key.

[dotfiles]
"~/.config/hive/config.yaml" = "machines/grafana/hive-config.yaml"

# Work-only Hive Desktop config. `flows/` is entirely Grafana-specific, so the
# overlay owns the whole directory (symlink-each, so the app can still write new
# flows into a real dir). `ai-gateway` slots into the otherwise-shared
# workspaces/ directory — an overlay entry inside a symlink-each dir is
# supported and survives re-apply without being pruned.
"~/.config/hive/desktop/flows" = { source = "machines/grafana/hive-desktop/flows", mode = "symlink-each" }
"~/.config/hive/desktop/workspaces/ai-gateway" = "machines/grafana/hive-desktop/workspaces/ai-gateway"
