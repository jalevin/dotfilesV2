# hive CLI config — personal machine.
#
# Selected by MISE_ENV via mise.personal.toml; hive has no include/layering
# mechanism (one --config path), so each machine carries a whole file and the
# shared bulk below is duplicated. Keep divergence to the `rules:` section so
# the two files stay easy to diff:
#   diff machines/grafana/hive-config.yaml machines/personal/hive-config.yaml

workspaces:
  - /Users/jeff/projects

agents:
  default: claude-yolo
  claude:
    command: claude
  claude-yolo:
    command: claude
    flags:
      - "--dangerously-skip-permissions"

views:
  store:
    enabled: true
  sessions:
    refresh_interval: 10s
    preview_enabled: true
    keybindings:
      A:
        cmd: SendAccept
      #ctrl+d:
      #  cmd: TmuxKill
      p:
        cmd: TmuxPopUp
      S:
        cmd: TmuxStart

todos:
  actions:
    obsidian: "open {{ .URI | shq }}"

plugins:
  shell_workers: 10 # shared subprocess concurrency limit
  github:
    enabled: true
    results_cache: 30m
  claude:
    yellow_threshold: 60 # % to turn yellow
    red_threshold: 80 # % to turn red
    model_limit: 200000 # context window size

rules:
  - pattern: ""
    clone_strategy: full
    max_recycled: 3
    commands:
      - git checkout -b "jalevin/{{ .Slug }}-{{ .ID }}"
      - hive ctx init
      - mise trust
    windows:
      - name: "{{ agentWindow }}"
        command: "{{ agentCommand }} {{ agentFlags }}"
        focus: true
      - name: shell
      - name: server

  - pattern: "recipinned"
    commands:
      - mise run pc:install




  - pattern: "dotfilesV2"
    clone_strategy: worktree
