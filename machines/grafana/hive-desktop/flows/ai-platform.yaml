# Hive Desktop flow — nodes and wires, as code.
# Edited by hand or by the app; on a change the engine reloads the flow set
# and reinstalls its runners.
version: 1
name: ai-platform
nodes:
  - id: my-open-prs-src
    type: sources.github
    credential: github/jalevin
    kind: search
    query: is:open is:pr author:@me archived:false
  - id: my-open-prs
    type: feed
    name: My open PRs
  - id: assigned-src
    type: sources.github
    credential: github/jalevin
    kind: search
    query: is:open assignee:@me archived:false
  - id: assigned
    type: feed
    name: Assigned
  - id: notifications-src
    type: sources.github
    credential: github/jalevin
    kind: notifications
  - id: notifications
    type: feed
    name: Notifications
  - id: review-requests-filter
    type: github-filter
    reasons:
      - review_requested
  - id: review-requests
    type: feed
    name: Review requests
    icon: eye
  - id: review-requests-notify
    type: notify
    name: Review requested
    title: Review requested
    body: '{{ .Payload.repo }} #{{ .Payload.num }} · {{ .Payload.title }}'
wires:
  - from: my-open-prs-src
    to: my-open-prs
  - from: assigned-src
    to: assigned
  - from: notifications-src
    to: notifications
  - from: notifications-src
    to: review-requests-filter
  - from: review-requests-filter
    to: review-requests
  - from: review-requests-filter
    to: review-requests-notify
